<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout – AutoUBI</title>
    <link rel="stylesheet" th:href="@{/css/carrinho.css}" />
    <style>
        .checkout-grid { display: grid; grid-template-columns: 1fr 360px; gap: 2rem; align-items: start; }
        .checkout-section { background: linear-gradient(135deg, #2d2521 0%, #352c25 100%); border-radius: 12px; border: 1px solid rgba(255,248,231,0.06); padding: 1.5rem; margin-bottom: 1.5rem; }
        .checkout-section h2 { font-family: 'JetBrains Mono', monospace; font-size: 1rem; color: #D4A259; margin-bottom: 1rem; letter-spacing: 1px; text-transform: uppercase; }
        .checkout-table { width: 100%; border-collapse: collapse; }
        .checkout-table th { text-align: left; font-size: 0.8rem; color: rgba(255,248,231,0.4); text-transform: uppercase; letter-spacing: 0.5px; padding: 0.5rem 0; border-bottom: 1px solid rgba(255,248,231,0.08); }
        .checkout-table td { padding: 0.75rem 0; border-bottom: 1px solid rgba(255,248,231,0.05); font-size: 0.9rem; color: #FFF8E7; vertical-align: middle; }
        .checkout-table td:last-child { text-align: right; font-family: 'JetBrains Mono', monospace; color: #D4A259; }
        .payment-options { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .payment-option { position: relative; }
        .payment-option input[type="radio"] { position: absolute; opacity: 0; width: 0; }
        .payment-option label { display: flex; align-items: center; gap: 0.75rem; padding: 0.9rem 1rem; border-radius: 10px; border: 1px solid rgba(255,248,231,0.1); cursor: pointer; transition: all 0.2s; font-size: 0.9rem; color: rgba(255,248,231,0.7); background: rgba(255,248,231,0.03); }
        .payment-option input[type="radio"]:checked + label { border-color: #D4A259; background: rgba(212,162,89,0.1); color: #FFF8E7; }
        .payment-option label svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
        .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; font-size: 0.9rem; color: rgba(255,248,231,0.6); border-bottom: 1px solid rgba(255,248,231,0.05); }
        .summary-row.total { border-bottom: none; margin-top: 0.5rem; padding-top: 0.75rem; border-top: 1px solid rgba(255,248,231,0.1); font-size: 1.1rem; color: #D4A259; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
        .btn-confirmar { width: 100%; padding: 0.9rem; background: #D4A259; color: #1a1410; border: none; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 1rem; }
        .btn-confirmar:hover { background: #e8b76a; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(212,162,89,0.3); }
        @media (max-width: 768px) { .checkout-grid { grid-template-columns: 1fr; } .payment-options { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header class="mb-header">
    <div class="mb-container">
        <div class="mb-logo"><a th:href="@{/cliente}">AutoUBI</a></div>
        <nav class="mb-nav"></nav>
        <a th:href="@{/cliente/carrinho}" class="mb-stat" title="Carrinho">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="18" height="18">
                <path d="M12 2C10.34 2 9 3.34 9 5V6H5C3.9 6 3 6.9 3 8V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V8C21 6.9 20.1 6 19 6H15V5C15 3.34 13.66 2 12 2zM11 6V5C11 4.45 11.45 4 12 4C12.55 4 13 4.45 13 5V6H11zM19 8V20H5V8H19Z"/>
            </svg>
        </a>
        <a th:href="@{/perfil}" class="mb-stat" title="Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <circle cx="12" cy="8" r="4" /><path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
            </svg>
        </a>
        <form th:action="@{/logout}" method="post" style="display:contents;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="mb-logout" title="Logout" style="background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                    <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                </svg>
            </button>
        </form>
        </a>
    </div>
</header>

<div class="carrinho-page">
    <div class="container">
        <h1>CHECKOUT</h1>

        <form th:action="@{/cliente/carrinho/checkout}" method="post">
            <div class="checkout-grid">
                <div>
                    <div class="checkout-section">
                        <h2>Resumo da Encomenda</h2>
                        <table class="checkout-table">
                            <thead>
                                <tr>
                                    <th>Veículo</th>
                                    <th style="text-align:center">Qtd.</th>
                                    <th style="text-align:right">Preço Unit.</th>
                                    <th style="text-align:right">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${itensCarrinho}">
                                    <td th:text="${item.veiculo.nome}"></td>
                                    <td style="text-align:center" th:text="${item.quantidade}"></td>
                                    <td style="text-align:right; font-family:'JetBrains Mono',monospace; color:#D4A259"
                                        th:text="'€' + ${#numbers.formatDecimal(item.veiculo.preco, 1, 2)}"></td>
                                    <td th:text="'€' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="checkout-section">
                        <h2>Morada de Entrega</h2>
                        <input type="text" name="morada" placeholder="Rua, nº, cidade, código postal" required
                               style="width:100%; padding:.8rem 1rem; border-radius:8px; border:1px solid rgba(212,162,89,0.3); background:rgba(255,255,255,0.05); color:#FFF8E7; font-size:.9rem; box-sizing:border-box;" />
                    </div>
                    <div class="checkout-section">
                        <h2>Método de Pagamento</h2>
                        <div class="payment-options">
                            <div class="payment-option">
                                <input type="radio" id="mbway" name="metodoPagamento" value="MB Way" required />
                                <label for="mbway">
                                    <svg viewBox="0 0 24 24"><path d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14zm-5 2c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
                                    MB Way
                                </label>
                            </div>
                            <div class="payment-option">
                                <input type="radio" id="multibanco" name="metodoPagamento" value="Multibanco" />
                                <label for="multibanco">
                                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
                                    Multibanco
                                </label>
                            </div>
                            <div class="payment-option">
                                <input type="radio" id="cartao" name="metodoPagamento" value="Cartão de Crédito" />
                                <label for="cartao">
                                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
                                    Cartão de Crédito
                                </label>
                            </div>
                            <div class="payment-option">
                                <input type="radio" id="transferencia" name="metodoPagamento" value="Transferência Bancária" />
                                <label for="transferencia">
                                    <svg viewBox="0 0 24 24"><path d="M4 10h3v7H4zm6.5 0h3v7h-3zM2 19h20v3H2zm15-9h3v7h-3zM12 1L2 6v2h20V6z"/></svg>
                                    Transferência Bancária
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="checkout-section">
                        <h2>Total</h2>
                        <div th:each="item : ${itensCarrinho}" class="summary-row">
                            <span th:text="${item.veiculo.nome} + ' x' + ${item.quantidade}"></span>
                            <span th:text="'€' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span th:text="'€' + ${#numbers.formatDecimal(totalCarrinho, 1, 2)}"></span>
                        </div>
                        <button type="submit" class="btn-confirmar">Confirmar Compra</button>
                        <div style="text-align:center; margin-top:0.75rem;">
                            <a th:href="@{/cliente/carrinho}" style="font-size:0.85rem; color:rgba(255,248,231,0.4); text-decoration:none;">← Voltar ao carrinho</a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
