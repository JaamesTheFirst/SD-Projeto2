<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Checkout – AutoUBI</title>
    <link rel="stylesheet" th:href="@{/css/carrinho.css}" />
    <style>
        .checkout-form { max-width: 500px; margin: 2rem auto; background: rgba(255,248,231,0.05); padding: 2rem; border-radius: 12px; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: .4rem; color: #D4A259; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: .7rem 1rem; border-radius: 8px; border: 1px solid rgba(212,162,89,0.3); background: rgba(255,255,255,0.05); color: #FFF8E7; font-size: 1rem; }
        .form-group select option { background: #1a1a1a; }
        .resumo { background: rgba(212,162,89,0.08); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
        .resumo h3 { color: #D4A259; margin-bottom: .8rem; }
        .resumo-item { display: flex; justify-content: space-between; padding: .3rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .resumo-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1rem; margin-top: .8rem; color: #D4A259; }
        .btn-confirmar { width: 100%; padding: .9rem; background: #D4A259; color: #1a1a1a; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .btn-confirmar:hover { background: #e8b76a; }
        .btn-voltar { display: inline-block; margin-top: 1rem; color: #D4A259; text-decoration: none; }
    </style>
</head>
<body>
<header class="mb-header">
    <div class="mb-container">
        <div class="mb-logo"><a th:href="@{/cliente}">AutoUBI</a></div>
        <nav class="mb-nav"></nav>
        <a th:href="@{/logout}" class="mb-logout" title="Logout">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
            </svg>
        </a>
    </div>
</header>

<div class="carrinho-page">
    <div class="container">
        <h1>CHECKOUT</h1>
        <div class="checkout-form">
            <div class="resumo">
                <h3>Resumo da Encomenda</h3>
                <div class="resumo-item" th:each="item : ${itensCarrinho}">
                    <span th:text="${item.veiculo.nome} + ' x' + ${item.quantidade}"></span>
                    <span>€<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span></span>
                </div>
                <div class="resumo-total">
                    <span>Total</span>
                    <span>€<span th:text="${#numbers.formatDecimal(totalCarrinho, 1, 2)}"></span></span>
                </div>
            </div>

            <form th:action="@{/cliente/carrinho/checkout}" method="post">
                <div class="form-group">
                    <label>Morada de Entrega</label>
                    <input type="text" name="morada" placeholder="Rua, nº, cidade, código postal" required />
                </div>
                <div class="form-group">
                    <label>Tipo de Pagamento</label>
                    <select name="tipoPagamento" required>
                        <option value="">Selecionar...</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="Cartão de Débito">Cartão de Débito</option>
                        <option value="MB WAY">MB WAY</option>
                        <option value="Transferência Bancária">Transferência Bancária</option>
                        <option value="PayPal">PayPal</option>
                    </select>
                </div>
                <button type="submit" class="btn-confirmar">Confirmar Encomenda</button>
            </form>
            <a th:href="@{/cliente/carrinho}" class="btn-voltar">← Voltar ao Carrinho</a>
        </div>
    </div>
</div>
</body>
</html>
