<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compra Confirmada – AutoUBI</title>
    <link rel="stylesheet" th:href="@{/css/carrinho.css}" />
    <style>
        .confirmacao-box { max-width: 520px; margin: 4rem auto; text-align: center; background: linear-gradient(135deg, #2d2521, #352c25); border-radius: 16px; border: 1px solid rgba(255,248,231,0.08); padding: 3rem 2rem; }
        .check-icon { width: 72px; height: 72px; background: rgba(212,162,89,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
        .check-icon svg { width: 36px; height: 36px; fill: #D4A259; }
        .confirmacao-box h1 { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; color: #FFF8E7; margin-bottom: 0.5rem; }
        .confirmacao-box p { color: rgba(255,248,231,0.55); font-size: 0.95rem; margin-bottom: 2rem; }
        .fatura-id { font-family: 'JetBrains Mono', monospace; color: #D4A259; font-size: 1rem; background: rgba(212,162,89,0.08); border: 1px solid rgba(212,162,89,0.2); border-radius: 8px; padding: 0.5rem 1rem; display: inline-block; margin-bottom: 2rem; }
        .btn-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn-pdf { display: inline-flex; align-items: center; gap: 8px; padding: 0.75rem 1.5rem; background: #D4A259; color: #1a1410; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.9rem; text-decoration: none; transition: all 0.2s; text-transform: uppercase; }
        .btn-pdf:hover { background: #e8b76a; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(212,162,89,0.3); }
        .btn-pdf svg { width: 18px; height: 18px; fill: currentColor; }
        .btn-catalog { display: inline-flex; align-items: center; gap: 8px; padding: 0.75rem 1.5rem; background: rgba(255,248,231,0.06); color: rgba(255,248,231,0.7); border: 1px solid rgba(255,248,231,0.1); border-radius: 10px; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 0.9rem; text-decoration: none; transition: all 0.2s; text-transform: uppercase; }
        .btn-catalog:hover { background: rgba(255,248,231,0.1); color: #FFF8E7; }
    </style>
</head>
<body>
<header class="mb-header">
    <div class="mb-container">
        <div class="mb-logo"><a th:href="@{/cliente}">AutoUBI</a></div>
        <nav class="mb-nav"></nav>
        <a th:href="@{/cliente/carrinho}" class="mb-stat" title="Carrinho">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="18" height="18">
                <path d="M12 2C10.34 2 9 3.34 9 5V6H5C3.9 6 3 6.9 3 8V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V8C21 6.9 20.1 6 19 6H15V5C15 3.34 13.66 2 12 2zM11 6V5C11 4.45 11.45 4 12 4C12.55 4 13 4.45 13 5V6H11zM19 8V20H5V8H19Z"/>
            </svg>
        </a>
        <a th:href="@{/perfil}" class="mb-stat" title="Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <circle cx="12" cy="8" r="4" /><path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
            </svg>
        </a>
        <form th:action="@{/logout}" method="post" style="display:contents;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="mb-logout" title="Logout" style="background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                    <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                </svg>
            </button>
        </form>
        </a>
    </div>
</header>

<div class="carrinho-page">
    <div class="container">
        <div class="confirmacao-box">
            <div class="check-icon">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            </div>
            <h1>Compra Confirmada!</h1>
            <p th:text="${successMessage}">A sua encomenda foi processada com sucesso.</p>
            <div class="fatura-id" th:text="'Fatura #' + ${faturaId}">Fatura #0</div>
            <div class="btn-actions">
                <a th:href="@{/api/fatura/{id}/pdf(id=${faturaId})}" class="btn-pdf">
                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    Descarregar Fatura PDF
                </a>
                <a th:href="@{/cliente}" class="btn-catalog">
                    Ver Catálogo
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
