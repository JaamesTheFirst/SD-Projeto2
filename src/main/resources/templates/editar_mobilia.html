<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Editar Mobília - Mobílubi</title>
    <link rel="stylesheet" th:href="@{/css/add_mobilia.css}" />
</head>
<body>
<div class="admin-page">
    <div class="form-container">
        <div class="form-box">
            <div class="brand">
                <h2>Mobílubi</h2>
            </div>
            <h1>Editar Mobília</h1>

            <!-- Mensagens de erro / sucesso -->
            <div th:if="${errorMessage}" style="color: red; margin-bottom: 10px;">
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/mobilia/atualizar/{id}(id=${mobilia.id})}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="input-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" th:value="${mobilia.nome}" placeholder="Nome da Mobília" required />
                </div>

                <div class="input-group">
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" name="descricao" placeholder="Descrição do produto" rows="3"
                              style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; font-family:inherit;"
                              th:text="${mobilia.descricao}"></textarea>
                </div>

                <div class="input-group">
                    <label for="preco">Preço (€):</label>
                    <input type="number" step="0.01" min="0.01" id="preco" name="preco" th:value="${mobilia.preco}" placeholder="Preço" required />
                </div>

                <div class="input-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" min="0" id="quantidade" name="quantidade" th:value="${mobilia.quantidade}" placeholder="Quantidade" required />
                </div>

                <div class="input-group">
                    <label for="categoriaId">Categoria:</label>
                    <select id="categoriaId" name="categoriaId" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
                        <option value="">-- Sem categoria --</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.id}"
                                th:text="${cat.nome}"
                                th:selected="${mobilia.categoria != null and mobilia.categoria.id == cat.id}">
                        </option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="imageFile">Imagem (deixe vazio para manter a atual):</label>
                    <div th:if="${mobilia.imagem}" style="margin-bottom: 10px;">
                        <img th:src="@{'/' + ${mobilia.imagem}}" alt="Imagem atual"
                             style="max-height: 120px; border-radius: 8px; border: 1px solid #ddd;"
                             onerror="this.style.display='none';" />
                    </div>
                    <input type="file" id="imageFile" name="imageFile" accept="image/*" />
                </div>

                <div class="options" style="margin-top: 15px;">
                    <a th:href="@{/admin}" class="btn-cancel">Cancelar</a>
                </div>

                <button type="submit" class="btn-submit">Atualizar Mobília</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
