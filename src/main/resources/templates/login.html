<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - AutoUBI</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>
<div class="login-page">
    <div class="form-container">
        <div class="form-box">
            <div class="brand">
                <h2>AutoUBI</h2>
            </div>
            <h1>LOGIN</h1>


            <div th:if="${errorMessage}" class="alert alert-danger" style="color: red; margin-bottom: 10px;">
                <span th:text="${errorMessage}"></span>
            </div>
            <div th:if="${successMessage}" class="alert alert-success" style="color: green; margin-bottom: 10px;">
                <span th:text="${successMessage}"></span>
            </div>


            <form th:action="@{/login-process}" th:object="${clienteForm}" method="post">
                <div class="input-group">
                    <input type="email" th:field="*{email}" placeholder="Email" required />
                </div>
                <div class="input-group">
                    <input type="password" th:field="*{password}" placeholder="Password" required />
                </div>
                <div class="options">
                    <a th:href="@{/register}" class="forgot">Não tem Conta?</a>

                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
            <div style="margin-top:1rem;text-align:center;">
                <a th:href="@{/cliente}" style="display:inline-block;width:100%;padding:0.65rem;border:1px solid rgba(255,248,231,0.25);border-radius:6px;color:rgba(255,248,231,0.6);text-decoration:none;font-size:0.9rem;transition:border-color 0.2s,color 0.2s;"
                   onmouseover="this.style.borderColor='rgba(212,162,89,0.6)';this.style.color='#D4A259'"
                   onmouseout="this.style.borderColor='rgba(255,248,231,0.25)';this.style.color='rgba(255,248,231,0.6)'">
                    Continuar como Visitante
                </a>
            </div>
        </div>
    </div>

    <div class="illustration">
        <img src="/images/s1m.webp" alt="AutoUBI - Loja de Veículos"/>
    </div>
</div>
</body>
</html>
