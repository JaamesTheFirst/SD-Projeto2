<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Adicionar Mobília - Mobílubi</title>
    <link rel="stylesheet" th:href="@{/css/add_mobilia.css}" />
</head>
<body>

<header class="mb-header">
    <div class="mb-container">
        <div class="mb-logo">
            <a th:href="@{/admin}">Mobílubi</a>
        </div>
    </div>
</header>

<div class="admin-page">
    <div class="form-container">
        <div class="form-box">
            <div class="brand">
                <h2>Mobílubi</h2>
            </div>
            <h1 th:text="${mobilia.id != null ? 'Editar Mobília' : 'Adicionar Nova Mobília'}">Adicionar Nova Mobília</h1>

            <!-- Mensagens de erro / sucesso -->
            <div th:if="${errorMessage}" class="alert alert-error">
                <span th:text="${errorMessage}"></span>
            </div>
            <div th:if="${successMessage}" class="alert alert-success">
                <span th:text="${successMessage}"></span>
            </div>

            <form th:action="@{/mobilia/salvar}"
                  th:object="${mobilia}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:field="*{id}" />

                <div class="input-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" th:field="*{nome}" placeholder="Nome da Mobília" required />
                    <div th:if="${#fields.hasErrors('nome')}" style="color: #e74c3c; font-size: 0.8rem; margin-top: 4px;">
                        <p th:errors="*{nome}"></p>
                    </div>
                </div>

                <div class="input-group">
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" th:field="*{descricao}" placeholder="Descrição do produto" rows="3"></textarea>
                </div>

                <div class="input-group">
                    <label for="preco">Preço (€):</label>
                    <input type="number" step="0.01" min="0.01" id="preco" th:field="*{preco}" placeholder="Preço" required />
                    <div th:if="${#fields.hasErrors('preco')}" style="color: #e74c3c; font-size: 0.8rem; margin-top: 4px;">
                        <p th:errors="*{preco}"></p>
                    </div>
                </div>

                <div class="input-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" min="0" id="quantidade" th:field="*{quantidade}" placeholder="Quantidade" required />
                    <div th:if="${#fields.hasErrors('quantidade')}" style="color: #e74c3c; font-size: 0.8rem; margin-top: 4px;">
                        <p th:errors="*{quantidade}"></p>
                    </div>
                </div>

                <div class="input-group">
                    <label for="categoriaId">Categoria:</label>
                    <select id="categoriaId" name="categoriaId">
                        <option value="">-- Selecione uma categoria --</option>
                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}" th:selected="${mobilia.categoria != null and mobilia.categoria.id == cat.id}"></option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="imageFile">Imagem:</label>
                    <input type="file" id="imageFile" name="imageFile" accept="image/*" />
                    <small style="color: rgba(255,248,231,0.5); font-size: 0.8rem; display: block; margin-top: 4px;">Se não selecionar nenhuma, a imagem anterior será mantida.</small>
                </div>

                <button type="submit" class="btn-submit">Salvar Mobília</button>
                <a th:href="@{/admin}" class="btn-cancel">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
