<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Adicionar Mobília - Mobílubi</title>
    <link rel="stylesheet" th:href="@{/css/add_mobilia.css}" />
</head>
<body>
<div class="admin-page">
    <div class="form-container">
        <div class="form-box">
            <div class="brand">
                <h2>Mobílubi</h2>
            </div>
            <h1>Adicionar Nova Mobília</h1>

            <!-- Mensagens de erro / sucesso -->
            <div th:if="${errorMessage}" style="color: red; margin-bottom: 10px;">
                <span th:text="${errorMessage}"></span>
            </div>
            <div th:if="${successMessage}" style="color: green; margin-bottom: 10px;">
                <span th:text="${successMessage}"></span>
            </div>

            <form th:action="@{/mobilia/salvar}"
                  th:object="${mobilia}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="input-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" th:field="*{nome}" placeholder="Nome da Mobília" required />
                    <div th:if="${#fields.hasErrors('nome')}" style="color: red;">
                        <p th:errors="*{nome}"></p>
                    </div>
                </div>

                <div class="input-group">
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" th:field="*{descricao}" placeholder="Descrição do produto" rows="3" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; font-family:inherit;"></textarea>
                </div>

                <div class="input-group">
                    <label for="preco">Preço (€):</label>
                    <input type="number" step="0.01" min="0.01" id="preco" th:field="*{preco}" placeholder="Preço" required />
                    <div th:if="${#fields.hasErrors('preco')}" style="color: red;">
                        <p th:errors="*{preco}"></p>
                    </div>
                </div>

                <div class="input-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" min="0" id="quantidade" th:field="*{quantidade}" placeholder="Quantidade" required />
                    <div th:if="${#fields.hasErrors('quantidade')}" style="color: red;">
                        <p th:errors="*{quantidade}"></p>
                    </div>
                </div>

                <div class="input-group">
                    <label for="categoriaId">Categoria:</label>
                    <select id="categoriaId" name="categoriaId" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
                        <option value="">-- Selecione uma categoria --</option>
                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="imageFile">Imagem:</label>
                    <input type="file" id="imageFile" name="imageFile" accept="image/*" required />
                </div>

                <div class="options" style="margin-top: 15px;">
                    <a th:href="@{/admin}" class="btn-cancel">Cancelar</a>
                </div>

                <button type="submit" class="btn-submit">Salvar Mobília</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
