<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho – AutoUBI</title>
    <link rel="stylesheet" th:href="@{/css/carrinho.css}" />
</head>
<body>
<!-- ====== HEADER DO CLIENTE ====== -->
<header class="mb-header">
    <div class="mb-container">
        <div class="mb-logo">
            <a th:href="@{/cliente}">AutoUBI</a>
        </div>
        <nav class="mb-nav"></nav>
        <a th:href="@{/cliente/carrinho}" class="mb-stat" title="Carrinho" style="background: rgba(212,162,89,0.15);">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#D4A259" viewBox="0 0 24 24" width="18" height="18">
                <path d="M12 2C10.34 2 9 3.34 9 5V6H5C3.9 6 3 6.9 3 8V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V8C21 6.9 20.1 6 19 6H15V5C15 3.34 13.66 2 12 2zM11 6V5C11 4.45 11.45 4 12 4C12.55 4 13 4.45 13 5V6H11zM19 8V20H5V8H19Z"/>
            </svg>
        </a>
        <a th:href="@{/perfil}" class="mb-stat" title="Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
            </svg>
        </a>
        <a th:href="@{/logout}" class="mb-logout" title="Logout">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
            </svg>
        </a>
    </div>
</header>

<div class="carrinho-page">
    <div class="container">
        <h1>MEU CARRINHO</h1>
        
        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}"></span>
        </div>
        
        <div th:if="${#lists.isEmpty(itensCarrinho)}" class="carrinho-vazio">
            <p>O seu carrinho está vazio.</p>
            <a th:href="@{/cliente}" class="btn-voltar">Continuar a Comprar</a>
        </div>
        
        <div th:if="${!#lists.isEmpty(itensCarrinho)}">
            <div class="carrinho-items">
                <div class="carrinho-item" th:each="item : ${itensCarrinho}">
                    <div class="item-imagem">
                        <img th:src="@{'/' + ${item.veiculo.imagem}}" th:alt="${item.veiculo.nome}" />
                    </div>
                    <div class="item-info">
                        <h3 th:text="${item.veiculo.nome}"></h3>
                        <p class="item-preco">€<span th:text="${#numbers.formatDecimal(item.veiculo.preco, 1, 2)}"></span></p>
                        <p class="item-quantidade">Quantidade: <span th:text="${item.quantidade}"></span></p>
                        <p class="item-subtotal">Subtotal: €<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span></p>
                    </div>
                    <div class="item-acoes">
                        <form th:action="@{/cliente/carrinho/remover/{id}(id=${item.id})}" method="post">
                            <button type="submit" class="btn-remover">Remover</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="carrinho-total">
                <h2>Total: €<span th:text="${#numbers.formatDecimal(totalCarrinho, 1, 2)}"></span></h2>
                <div class="carrinho-acoes">
                    <a th:href="@{/cliente}" class="btn-continuar">Continuar a Comprar</a>
                    <form th:action="@{/cliente/carrinho/finalizar}" method="post" style="display: inline;">
                        <button type="submit" class="btn-finalizar">Finalizar Compra</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
