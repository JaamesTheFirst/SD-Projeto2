<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho – Mobílubi</title>
    <link rel="stylesheet" th:href="@{/css/carrinho.css}" />
</head>
<body>
<!-- ================== HEADER DO CLIENTE ================== -->
<header class="mb-header">
    <div class="mb-container">
        <div class="mb-logo">
            <a th:href="@{/cliente}">Mobílubi</a>
        </div>
        <nav class="mb-nav">
        </nav>
        <a th:href="@{/cliente/carrinho}" class="mb-stat" title="Carrinho">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="20" height="20">
                <path d="M12 2C10.34 2 9 3.34 9 5V6H5C3.9 6 3 6.9 3 8V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V8C21 6.9 20.1 6 19 6H15V5C15 3.34 13.66 2 12 2zM11 6V5C11 4.45 11.45 4 12 4C12.55 4 13 4.45 13 5V6H11zM19 8V20H5V8H19Z"/>
            </svg>
        </a>
        <a th:href="@{/perfil}" class="mb-stat" title="Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="20px" height="20px">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
            </svg>
        </a>
        <a th:href="@{/logout}" class="mb-logout" title="Logout">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="20px" height="20px">
                <path d="M10 2H4C2.897 2 2 2.897 2 4v16c0 1.103 0.897 2 2 2h6v-2H4V4h6V2zm9.707 10.707l-3 3a.999.999 0 0 1-1.414-1.414L16.586 13H9a1 1 0 1 1 0-2h7.586l-1.293-1.293a.999.999 0 1 1 1.414-1.414l3 3a.997.997 0 0 1 .003 1.414z"/>
            </svg>
        </a>
    </div>
</header>

<div class="carrinho-page">
    <div class="container">
        <h1>MEU CARRINHO</h1>
        
        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}"></span>
        </div>
        
        <div th:if="${#lists.isEmpty(itensCarrinho)}" class="carrinho-vazio">
            <p>Seu carrinho está vazio.</p>
            <a th:href="@{/cliente}" class="btn-voltar">Continuar Comprando</a>
        </div>
        
        <div th:if="${!#lists.isEmpty(itensCarrinho)}">
            <div class="carrinho-items">
                <div class="carrinho-item" th:each="item : ${itensCarrinho}">
                    <div class="item-imagem">
                        <img th:src="@{'/' + ${item.mobilia.imagem}}" th:alt="${item.mobilia.nome}" />
                    </div>
                    <div class="item-info">
                        <h3 th:text="${item.mobilia.nome}"></h3>
                        <p class="item-preco">€<span th:text="${#numbers.formatDecimal(item.mobilia.preco, 1, 2)}"></span></p>
                        <p class="item-quantidade">Quantidade: <span th:text="${item.quantidade}"></span></p>
                        <p class="item-subtotal">Subtotal: €<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span></p>
                    </div>
                    <div class="item-acoes">
                        <form th:action="@{/cliente/carrinho/remover/{id}(id=${item.id})}" method="post">
                            <button type="submit" class="btn-remover">Remover</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="carrinho-total">
                <h2>Total: €<span th:text="${#numbers.formatDecimal(totalCarrinho, 1, 2)}"></span></h2>
                <div class="carrinho-acoes">
                    <a th:href="@{/cliente}" class="btn-continuar">Continuar Comprando</a>
                    <form th:action="@{/cliente/carrinho/finalizar}" method="post" style="display: inline;">
                        <button type="submit" class="btn-finalizar">Finalizar Compra</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
