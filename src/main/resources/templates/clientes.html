<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo – AutoUBI</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<!-- ====== HEADER ====== -->
<header class="mb-header">
    <div class="mb-container">
        <div class="mb-logo">
            <a th:href="@{/cliente}">AutoUBI</a>
        </div>
        <nav class="mb-nav"></nav>
        <a th:href="${isGuest} ? '/guest/carrinho' : '/cliente/carrinho'" class="mb-stat cart-icon-wrapper" id="cart-icon" title="Carrinho">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="18" height="18">
                <path d="M12 2C10.34 2 9 3.34 9 5V6H5C3.9 6 3 6.9 3 8V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V8C21 6.9 20.1 6 19 6H15V5C15 3.34 13.66 2 12 2zM11 6V5C11 4.45 11.45 4 12 4C12.55 4 13 4.45 13 5V6H11zM19 8V20H5V8H19Z"/>
            </svg>
            <span class="cart-badge" id="cart-badge" style="display:none"></span>
        </a>
        <!-- logged-in links -->
        <a th:if="${!isGuest}" th:href="@{/perfil}" class="mb-stat" title="Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
            </svg>
        </a>
        <a th:if="${!isGuest}" th:href="@{/logout}" class="mb-logout" title="Logout">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
            </svg>
        </a>
        <!-- guest links -->
        <a th:if="${isGuest}" th:href="@{/login}" class="mb-stat" title="Iniciar Sessão">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
            </svg>
        </a>
        <a th:if="${isGuest}" th:href="@{/register(from='guest')}" class="mb-logout" title="Registar">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </a>
    </div>
</header>

<div class="page-content">
    <div class="container">
        <h1>CATÁLOGO DE VEÍCULOS</h1>

        <!-- Alerts -->
        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Category pills -->
        <div class="category-nav">
            <a th:href="@{/cliente}" class="cat-link"
               th:classappend="${filtroCategoriaId == null} ? ' cat-active' : ''">
                Todas
            </a>
            <a th:each="cat : ${categorias}"
               th:href="@{/cliente(categoriaId=${cat.id})}"
               th:text="${cat.nome}"
               class="cat-link"
               th:classappend="${filtroCategoriaId != null and filtroCategoriaId == cat.id} ? ' cat-active' : ''">
            </a>
        </div>

        <!-- Search bar -->
        <div class="search-container">
            <form th:action="@{/cliente}" method="get" class="search-form">
                <input type="hidden" name="categoriaId" th:value="${filtroCategoriaId}" th:if="${filtroCategoriaId != null}" />
                <div class="search-row">
                    <input type="text" name="nome" th:value="${filtroNome}" placeholder="Pesquisar por nome..." class="search-input" />
                    <input type="number" name="precoMin" th:value="${filtroPrecoMin}" placeholder="Preço mín." step="0.01" class="search-input-small" />
                    <input type="number" name="precoMax" th:value="${filtroPrecoMax}" placeholder="Preço máx." step="0.01" class="search-input-small" />
                    <label class="search-checkbox">
                        <input type="checkbox" name="emStock" th:checked="${filtroEmStock}" value="true" />
                        Em stock
                    </label>
                    <button type="submit" class="btn-search">Pesquisar</button>
                    <a th:href="@{/cliente(categoriaId=${filtroCategoriaId})}" class="btn-clear">Limpar</a>
                </div>
            </form>
        </div>

        <!-- Grid de produtos -->
        <div class="product-grid">
            <div class="product-card" th:each="veiculo : ${veiculos}">
                <a th:href="@{/cliente/veiculo/{id}(id=${veiculo.id})}" class="card-link">
                <div class="card-image">
                    <img th:src="@{'/' + ${veiculo.imagem}}" th:alt="${veiculo.nome}"
                         onerror="this.src='/images/placeholder.jpg';" />
                </div>
                <div class="card-body">
                    <h3 th:text="${veiculo.nome}"></h3>
                    <div class="card-category" th:if="${veiculo.marca != null}">
                        <span th:text="${veiculo.marca}"></span>
                        <span th:if="${veiculo.ano != null}" th:text="' · ' + ${veiculo.ano}"></span>
                    </div>
                    <div class="card-category" th:if="${veiculo.categoria != null}" th:text="${veiculo.categoria.nome}"></div>
                    <p class="card-desc" th:if="${veiculo.descricao != null and !veiculo.descricao.isEmpty()}"
                       th:text="${veiculo.descricao}"></p>
                    <p th:text="'€' + ${#numbers.formatDecimal(veiculo.preco, 1, 2)}" class="produto-preco"></p>
                    <p class="produto-stock">
                        <span th:if="${veiculo.quantidade > 0}" th:text="${veiculo.quantidade} + ' em stock'"></span>
                        <span th:if="${veiculo.quantidade == 0}" class="esgotado">Esgotado</span>
                    </p>
                </div>
                </a>
                <div class="card-actions">
                    <button class="btn-adicionar"
                            th:disabled="${veiculo.quantidade == 0}"
                            th:data-veiculo-id="${veiculo.id}"
                            th:attr="onclick=${veiculo.quantidade > 0} ? 'adicionarAoCarrinho(this)' : null">
                        <span th:if="${veiculo.quantidade > 0}">Adicionar</span>
                        <span th:if="${veiculo.quantidade == 0}">Esgotado</span>
                    </button>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(veiculos)}" class="no-results">
                <strong>Nenhum veículo encontrado.</strong>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
const IS_GUEST = /*[[${isGuest}]]*/ false;
const CART_ADD_URL = IS_GUEST ? '/guest/carrinho/adicionar/ajax' : '/cliente/carrinho/adicionar/ajax';
const CART_COUNT_URL = IS_GUEST ? '/guest/carrinho/count' : '/cliente/carrinho/count';

// Initialize badge count from server on page load
(function() {
    fetch(CART_COUNT_URL)
        .then(r => r.json())
        .then(data => updateCartBadge(data.count))
        .catch(() => {});
})();

function adicionarAoCarrinho(btn) {
    const veiculoId = btn.getAttribute('data-veiculo-id');
    const card = btn.closest('.product-card');
    const img = card ? card.querySelector('.card-image img') : null;

    btn.disabled = true;
    btn.textContent = '...';

    if (img) flyToCart(img);

    fetch(CART_ADD_URL, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            [document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN']:
                document.querySelector('meta[name="_csrf"]')?.content || ''
        },
        body: 'veiculoId=' + encodeURIComponent(veiculoId)
    })
    .then(r => r.json())
    .then(data => {
        showToast(data.message, data.success ? 'success' : 'error');
        if (data.success) {
            updateCartBadge(data.cartCount);
            btn.textContent = 'Adicionado ✓';
            setTimeout(() => {
                btn.textContent = 'Adicionar';
                btn.disabled = false;
            }, 2000);
        } else {
            btn.textContent = 'Adicionar';
            btn.disabled = false;
        }
    })
    .catch(() => {
        showToast('Erro ao adicionar ao carrinho.', 'error');
        btn.textContent = 'Adicionar';
        btn.disabled = false;
    });
}

function flyToCart(img) {
    const cartIcon = document.getElementById('cart-icon');
    if (!cartIcon) return;

    const imgRect = img.getBoundingClientRect();
    const cartRect = cartIcon.getBoundingClientRect();

    const clone = document.createElement('img');
    clone.src = img.src;
    clone.className = 'fly-item';
    clone.style.cssText = [
        'position:fixed',
        'left:' + (imgRect.left + imgRect.width / 2 - 30) + 'px',
        'top:' + (imgRect.top + imgRect.height / 2 - 30) + 'px',
        'width:60px', 'height:60px',
        'border-radius:50%',
        'object-fit:cover',
        'z-index:9998',
        'pointer-events:none',
        'transition:none'
    ].join(';');
    document.body.appendChild(clone);

    const destX = cartRect.left + cartRect.width / 2 - 30;
    const destY = cartRect.top + cartRect.height / 2 - 30;

    requestAnimationFrame(() => {
        clone.style.transition = 'all 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
        clone.style.left = destX + 'px';
        clone.style.top = destY + 'px';
        clone.style.width = '20px';
        clone.style.height = '20px';
        clone.style.opacity = '0.6';
    });

    setTimeout(() => {
        clone.remove();
        pulseBadge();
    }, 700);
}

function updateCartBadge(count) {
    const badge = document.getElementById('cart-badge');
    if (!badge) return;
    if (count > 0) {
        badge.textContent = count > 99 ? '99+' : count;
        badge.style.display = 'flex';
    } else {
        badge.style.display = 'none';
    }
}

function pulseBadge() {
    const badge = document.getElementById('cart-badge');
    if (!badge || badge.style.display === 'none') return;
    badge.classList.remove('badge-pulse');
    void badge.offsetWidth; // reflow to restart animation
    badge.classList.add('badge-pulse');
    setTimeout(() => badge.classList.remove('badge-pulse'), 400);
}

function showToast(message, type) {
    const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
    const container = document.querySelector('.container');
    const h1 = container ? container.querySelector('h1') : null;

    // remove any existing dynamic alert
    const existing = container && container.querySelector('.alert-dynamic');
    if (existing) existing.remove();

    const banner = document.createElement('div');
    banner.className = 'alert ' + alertClass + ' alert-dynamic';
    banner.textContent = message;

    if (h1 && h1.nextSibling) {
        container.insertBefore(banner, h1.nextSibling);
    } else if (container) {
        container.prepend(banner);
    }

    setTimeout(() => {
        banner.style.transition = 'opacity 0.4s';
        banner.style.opacity = '0';
        setTimeout(() => banner.remove(), 400);
    }, 4000);
}
</script>
</body>
</html>
