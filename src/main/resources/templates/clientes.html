<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo – Mobílubi</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}" />
</head>
<body>
<!-- ====== HEADER ====== -->
<header class="mb-header">
    <div class="mb-container">
        <div class="mb-logo">
            <a th:href="@{/cliente}">Mobílubi</a>
        </div>
        <nav class="mb-nav"></nav>
        <a th:href="@{/cliente/carrinho}" class="mb-stat" title="Carrinho">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="18" height="18">
                <path d="M12 2C10.34 2 9 3.34 9 5V6H5C3.9 6 3 6.9 3 8V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V8C21 6.9 20.1 6 19 6H15V5C15 3.34 13.66 2 12 2zM11 6V5C11 4.45 11.45 4 12 4C12.55 4 13 4.45 13 5V6H11zM19 8V20H5V8H19Z"/>
            </svg>
        </a>
        <a th:href="@{/perfil}" class="mb-stat" title="Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
            </svg>
        </a>
        <a th:href="@{/logout}" class="mb-logout" title="Logout">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
            </svg>
        </a>
    </div>
</header>

<div class="page-content">
    <div class="container">
        <h1>CATÁLOGO DE MÓVEIS</h1>

        <!-- Alerts -->
        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Category pills -->
        <div class="category-nav">
            <a th:href="@{/cliente}" class="cat-link"
               th:classappend="${filtroCategoriaId == null} ? ' cat-active' : ''">
                Todas
            </a>
            <a th:each="cat : ${categorias}"
               th:href="@{/cliente(categoriaId=${cat.id})}"
               th:text="${cat.nome}"
               class="cat-link"
               th:classappend="${filtroCategoriaId != null and filtroCategoriaId == cat.id} ? ' cat-active' : ''">
            </a>
        </div>

        <!-- Search bar -->
        <div class="search-container">
            <form th:action="@{/cliente}" method="get" class="search-form">
                <div class="search-row">
                    <input type="text" name="nome" th:value="${filtroNome}" placeholder="Pesquisar por nome..." class="search-input" />
                    <input type="number" name="precoMin" th:value="${filtroPrecoMin}" placeholder="Preço mín." step="0.01" class="search-input-small" />
                    <input type="number" name="precoMax" th:value="${filtroPrecoMax}" placeholder="Preço máx." step="0.01" class="search-input-small" />
                    <select name="categoriaId" class="search-input-small" style="padding:0.6rem 0.85rem; background:rgba(255,248,231,0.05); color:#FFF8E7; border:1px solid rgba(255,248,231,0.1); border-radius:8px;">
                        <option value="">Categoria</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.id}" th:text="${cat.nome}"
                                th:selected="${filtroCategoriaId != null and filtroCategoriaId == cat.id}">
                        </option>
                    </select>
                    <label class="search-checkbox">
                        <input type="checkbox" name="emStock" th:checked="${filtroEmStock}" value="true" />
                        Em stock
                    </label>
                    <button type="submit" class="btn-search">Pesquisar</button>
                    <a th:href="@{/cliente}" class="btn-clear">Limpar</a>
                </div>
            </form>
        </div>

        <!-- Products -->
        <div class="product-grid">
            <div class="product-card" th:each="mobili : ${mobilias}">
                <div class="card-image">
                    <img th:src="@{'/' + ${mobili.imagem}}" th:alt="${mobili.nome}"
                         onerror="this.src='/images/placeholder.jpg';" />
                </div>
                <div class="card-body">
                    <h3 th:text="${mobili.nome}"></h3>
                    <div class="card-category" th:if="${mobili.categoria != null}" th:text="${mobili.categoria.nome}"></div>
                    <div class="card-desc" th:if="${mobili.descricao != null and !mobili.descricao.isEmpty()}" th:text="${mobili.descricao}"></div>
                    <p th:text="'€' + ${#numbers.formatDecimal(mobili.preco, 1, 2)}" class="produto-preco"></p>
                    <p class="produto-stock">
                        <span th:if="${mobili.quantidade > 0}" th:text="${mobili.quantidade} + ' em stock'"></span>
                        <span th:if="${mobili.quantidade == 0}" class="esgotado">Esgotado</span>
                    </p>
                    <form th:action="@{/cliente/carrinho/adicionar}" method="post">
                        <input type="hidden" name="mobiliaId" th:value="${mobili.id}" />
                        <button type="submit" th:disabled="${mobili.quantidade == 0}" class="btn-adicionar">
                            <span th:if="${mobili.quantidade > 0}">Adicionar ao Carrinho</span>
                            <span th:if="${mobili.quantidade == 0}">Esgotado</span>
                        </button>
                    </form>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(mobilias)}" class="no-results">
                <strong>Nenhuma mobília encontrada.</strong>
            </div>
        </div>
    </div>
</div>
</body>
</html>
