<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil – AutoUBI</title>
    <link rel="stylesheet" th:href="@{/css/perfil.css}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="mb-header">
    <div class="mb-container">
        <div class="mb-logo">
            <a th:href="@{/cliente}">AutoUBI</a>
        </div>
        <nav class="mb-nav"></nav>
        <a th:href="@{/cliente/carrinho}" class="mb-stat" title="Carrinho">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="18" height="18">
                <path d="M12 2C10.34 2 9 3.34 9 5V6H5C3.9 6 3 6.9 3 8V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V8C21 6.9 20.1 6 19 6H15V5C15 3.34 13.66 2 12 2zM11 6V5C11 4.45 11.45 4 12 4C12.55 4 13 4.45 13 5V6H11zM19 8V20H5V8H19Z"/>
            </svg>
        </a>
        <a th:href="@{/perfil}" class="mb-stat mb-stat-active" title="Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#D4A259" viewBox="0 0 24 24" width="18" height="18">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
            </svg>
        </a>
        <form th:action="@{/logout}" method="post" style="display:contents;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="mb-logout" title="Logout" style="background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                    <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                </svg>
            </button>
        </form>
        </a>
    </div>
</header>

<div class="perfil-page">
    <div class="container">
        <h1>MEU PERFIL</h1>
        
        <div class="perfil-tabs">
            <button class="tab-btn active" onclick="openTab(event, 'tab-info')">Informações</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-stats')">Estatísticas</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-encomendas')">Encomendas</button>
        </div>
        
        <div class="perfil-content">
            <!-- ABA DE INFORMAÇÕES -->
            <div id="tab-info" class="tab-content active">
                <div class="perfil-section">
                    <h2>Informações da Conta</h2>
                    <div class="info-item">
                        <strong>Email:</strong> <span th:text="${clienteEmail}"></span>
                    </div>
                </div>

                <div class="perfil-section">
                    <h2>Resumo Estatístico</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number" th:text="${numeroCompras}">0</div>
                            <div class="stat-label">Compras Realizadas</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">€<span th:text="${#numbers.formatDecimal(totalGasto, 1, 2)}">0.00</span></div>
                            <div class="stat-label">Total Gasto</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">€<span th:text="${#numbers.formatDecimal(mediaGasto, 1, 2)}">0.00</span></div>
                            <div class="stat-label">Gasto Médio</div>
                        </div>
                    </div>
                </div>
            </div>


            <div id="tab-stats" class="tab-content">
                <div class="perfil-section">
                    <h2>Gastos por Mês (Ano Atual)</h2>
                    <div class="chart-container">
                        <canvas id="gastosChart"></canvas>
                    </div>
                </div>
                
                <div class="perfil-section">
                    <h2>Produtos Mais Comprados</h2>
                    <div class="chart-container">
                        <canvas id="produtosChart"></canvas>
                    </div>
                </div>
            </div>

            <div id="tab-encomendas" class="tab-content">
                <div class="perfil-section">
                    <h2>As Minhas Encomendas</h2>
                    <div id="encomendasLista">A carregar...</div>
                </div>
            </div>
        </div>
    </div>
</div>


<div id="faturaModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Detalhes da Fatura</h2>
            <span class="close" onclick="fecharModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div id="faturaDetalhes">
                <div class="loading">Carregando...</div>
            </div>
        </div>
    </div>
</div>

<script>

Chart.defaults.color = 'rgba(255,248,231,0.6)';
Chart.defaults.borderColor = 'rgba(255,248,231,0.08)';

let gastosChart = null;
let produtosChart = null;

function openTab(evt, tabName) {
    var i, tabcontent, tablinks;
    tabcontent = document.getElementsByClassName("tab-content");
    for (i = 0; i < tabcontent.length; i++) {
        tabcontent[i].classList.remove("active");
    }
    tablinks = document.getElementsByClassName("tab-btn");
    for (i = 0; i < tablinks.length; i++) {
        tablinks[i].classList.remove("active");
    }
    document.getElementById(tabName).classList.add("active");
    evt.currentTarget.classList.add("active");
    
    // Carregar gráfico quando abrir aba de estatísticas
    if (tabName === 'tab-stats') {
        setTimeout(() => {
            carregarEstatisticas();
        }, 100);
    }
    if (tabName === 'tab-encomendas') {
        carregarMinhasEncomendas();
    }
}


function carregarEstatisticas() {
    if (gastosChart && produtosChart) return; // Já carregado
    
    fetch('/perfil/estatisticas-json')
        .then(response => {
            if (!response.ok) {
                throw new Error('Erro ao carregar dados');
            }
            return response.json();
        })
        .then(data => {
            if (!gastosChart) {
                criarGraficoGastos(data.gastosPorMes || []);
            }
            if (!produtosChart) {
                criarGraficoProdutos(data.produtosMaisComprados || []);
            }
        })
        .catch(error => {
            console.error('Erro ao carregar estatísticas:', error);
            // Criar gráficos vazios em caso de erro
            if (!gastosChart) {
                criarGraficoGastos([]);
            }
            if (!produtosChart) {
                criarGraficoProdutos([]);
            }
        });
}

function criarGraficoGastos(gastosPorMes) {
    const ctx = document.getElementById('gastosChart');
    if (!ctx) return;
    
    const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    const dadosGastos = new Array(12).fill(0);
    
    if (gastosPorMes && Array.isArray(gastosPorMes)) {
        gastosPorMes.forEach(item => {
            if (item && item.length >= 3) {
                const mes = parseInt(item[1]) - 1;
                if (mes >= 0 && mes < 12) {
                    dadosGastos[mes] = parseFloat(item[2]) || 0;
                }
            }
        });
    }
    
    gastosChart = new Chart(ctx.getContext('2d'), {
        type: 'line',
        data: {
            labels: meses,
            datasets: [{
                label: 'Gastos (€)',
                data: dadosGastos,
                borderColor: '#D4A259',
                backgroundColor: 'rgba(212, 162, 89, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { callback: function(value) { return '€' + value.toFixed(2); } },
                    grid: { color: 'rgba(255,248,231,0.04)' }
                },
                x: { grid: { display: false } }
            },
            plugins: { legend: { display: false } }
        }
    });
}

function criarGraficoProdutos(produtosMaisComprados) {
    const ctx = document.getElementById('produtosChart');
    if (!ctx) return;
    
    if (!produtosMaisComprados || !Array.isArray(produtosMaisComprados) || produtosMaisComprados.length === 0) {
        produtosChart = new Chart(ctx.getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: ['Nenhum produto comprado'],
                datasets: [{ data: [1], backgroundColor: ['rgba(255,248,231,0.08)'], borderWidth: 0 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
        return;
    }
    
    const produtos = produtosMaisComprados.slice(0, 5);
    const labels = produtos.map(item => item[0] || 'Produto');
    const valores = produtos.map(item => parseInt(item[1]) || 0);
    
    const cores = ['#D4A259', '#e8b76a', '#c29042', '#a67832', '#8a6228'];
    
    produtosChart = new Chart(ctx.getContext('2d'), {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{ data: valores, backgroundColor: cores.slice(0, labels.length), borderWidth: 0 }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } }
        }
    });
}

function abrirDetalhes(faturaId) {
    const modal = document.getElementById('faturaModal');
    const detalhes = document.getElementById('faturaDetalhes');
    
    detalhes.innerHTML = '<div class="loading">Carregando detalhes...</div>';
    modal.style.display = 'block';
    
    fetch('/api/fatura/' + faturaId)
    .then(response => {
        if (!response.ok) throw new Error('Erro ao carregar detalhes');
        return response.json();
    })
    .then(data => mostrarDetalhes(data))
    .catch(error => {
        detalhes.innerHTML = '<div class="erro">Erro ao carregar detalhes da fatura.</div>';
    });
}

function mostrarDetalhes(fatura) {
    const modalTitle = document.getElementById('modalTitle');
    const faturaDetalhes = document.getElementById('faturaDetalhes');
    
    modalTitle.textContent = `Fatura #${fatura.id}`;
    
    let itensHtml = '';
    if (fatura.itens && fatura.itens.length > 0) {
        fatura.itens.forEach(item => {
            const subtotal = item.precoUnitario * item.quantidade;
            itensHtml += `
                <div class="item-detalhe">
                    <div class="item-nome">${item.nomeVeiculo}</div>
                    <div class="item-info">
                        <span>Qtd: ${item.quantidade}</span>
                        <span>€${item.precoUnitario.toFixed(2)}</span>
                        <span class="item-subtotal">€${subtotal.toFixed(2)}</span>
                    </div>
                </div>
            `;
        });
    } else {
        itensHtml = '<div class="no-items">Não há itens detalhados para esta fatura.</div>';
    }
    
    faturaDetalhes.innerHTML = `
        <div class="fatura-info-modal">
            <p><strong>Data:</strong> ${new Date(fatura.dataCompra).toLocaleString('pt-PT')}</p>
            <p><strong>Total:</strong> €${fatura.totalPago.toFixed(2)}</p>
            ${fatura.metodoPagamento ? `<p><strong>Método de Pagamento:</strong> ${fatura.metodoPagamento}</p>` : ''}
        </div>
        <div class="itens-lista">
            <h3>Itens da Compra</h3>
            ${itensHtml}
        </div>
        <div style="text-align:center; margin-top:1.5rem;">
            <a href="/api/fatura/${fatura.id}/pdf" class="btn-pdf-download">
                ⬇ Descarregar Fatura PDF
            </a>
        </div>
    `;
}

function carregarMinhasEncomendas() {
    fetch('/perfil/encomendas-json')
        .then(r => r.json())
        .then(data => {
            const lista = document.getElementById('encomendasLista');
            if (!data.length) {
                lista.innerHTML = '<p>Ainda não tens encomendas.</p>';
                return;
            }
            lista.innerHTML = data.map(e => `
                <div class="fatura-card" style="display: flex; align-items: center; justify-content: space-between; padding: 25px;">

                    <div class="fatura-esquerda" style="min-width: 160px; display: flex; align-items: center;">
                        <div class="fatura-id" style="margin: 0; font-size: 1.25rem; font-weight: bold; color: #FFF8E7;">
                            Encomenda #${e.id}
                        </div>
                    </div>

                    <div class="fatura-direita" style="display: flex; align-items: center; gap: 30px; flex-grow: 1; justify-content: space-between;">

                        <div style="min-width: 110px; display: flex; align-items: center;">
                            <span class="badge-estado" style="background:${estadoBg(e.estado)}; color:${estadoCor(e.estado)}; margin: 0; display: inline-block;">
                                ${e.estado || 'Pendente'}
                            </span>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 130px;">
                            <span style="font-size:0.75rem; color:rgba(255, 248, 231, 0.4); text-transform:uppercase; letter-spacing: 0.5px;">Data</span>
                            <span style="color: #FFF8E7; font-size: 0.95rem;">${e.dataCompra}</span>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 140px; max-width: 180px;">
                            <span style="font-size:0.75rem; color:rgba(255, 248, 231, 0.4); text-transform:uppercase; letter-spacing: 0.5px;">Morada</span>
                            <span style="color: #FFF8E7; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${e.morada || ''}">
                                ${e.morada || 'Não definida'}
                            </span>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 110px; text-align: right;">
                            <span style="font-size:0.75rem; color:rgba(255, 248, 231, 0.4); text-transform:uppercase; letter-spacing: 0.5px;">Total Pago</span>
                            <span style="font-size: 1.25rem; font-weight: bold; color: #D4A259;">€${parseFloat(e.totalPago).toFixed(2)}</span>
                        </div>

                        <a href="/api/fatura/${e.id}/pdf" class="btn-detalhes" style="height: fit-content; align-self: center; margin-left: 10px;">
                            <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16" style="margin-right: 5px; vertical-align: middle;">
                                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                                <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                            </svg>
                            PDF
                        </a>
                    </div>
                </div>
            `).join('');
        });
}

function estadoCor(estado) {
    const cores = {'Pendente':'#e67e22','Em preparação':'#3498db','Enviado':'#9b59b6','Entregue':'#27ae60'};
    return cores[estado] || '#e67e22';
}

function estadoBg(estado) {
    const cores = {'Pendente':'rgba(230,126,34,0.2)','Em preparação':'rgba(52,152,219,0.2)','Enviado':'rgba(155,89,182,0.2)','Entregue':'rgba(39,174,96,0.2)'};
    return cores[estado] || 'rgba(230,126,34,0.2)';
}
function fecharModal() {
    document.getElementById('faturaModal').style.display = 'none';
}

window.onclick = function(event) {
    const modal = document.getElementById('faturaModal');
    if (event.target == modal) modal.style.display = 'none';
}
</script>
</body>
</html>
