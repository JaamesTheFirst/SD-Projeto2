<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>As Minhas Encomendas – AutoUBI</title>
    <link rel="stylesheet" th:href="@{/css/carrinho.css}" />
    <style>
        .encomendas-lista { max-width: 800px; margin: 2rem auto; }
        .encomenda-card { background: rgba(255,248,231,0.05); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid rgba(212,162,89,0.15); }
        .encomenda-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: .5rem; }
        .encomenda-num { font-size: 1.1rem; font-weight: 700; color: #D4A259; }
        .encomenda-estado { padding: .3rem .8rem; border-radius: 20px; font-size: .85rem; font-weight: 600; }
        .estado-pendente { background: rgba(230,126,34,0.2); color: #e67e22; }
        .estado-preparacao { background: rgba(52,152,219,0.2); color: #3498db; }
        .estado-enviado { background: rgba(155,89,182,0.2); color: #9b59b6; }
        .estado-entregue { background: rgba(39,174,96,0.2); color: #27ae60; }
        .encomenda-info { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: 1rem; font-size: .9rem; color: rgba(255,248,231,0.7); }
        .encomenda-info span { color: #FFF8E7; }
        .encomenda-itens { border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem; margin-bottom: 1rem; }
        .encomenda-item { display: flex; justify-content: space-between; padding: .3rem 0; font-size: .9rem; }
        .encomenda-total { display: flex; justify-content: space-between; font-weight: 700; color: #D4A259; border-top: 1px solid rgba(212,162,89,0.2); padding-top: .8rem; }
        .btn-pdf-small { display: inline-block; padding: .5rem 1.2rem; background: #D4A259; color: #1a1a1a; border-radius: 6px; font-weight: 700; text-decoration: none; font-size: .85rem; }
    </style>
</head>
<body>
<header class="mb-header">
    <div class="mb-container">
        <div class="mb-logo"><a th:href="@{/cliente}">AutoUBI</a></div>
        <nav class="mb-nav"></nav>
        <a th:href="@{/cliente/carrinho}" class="mb-stat" title="Carrinho">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#D4A259" viewBox="0 0 24 24" width="18" height="18">
                <path d="M12 2C10.34 2 9 3.34 9 5V6H5C3.9 6 3 6.9 3 8V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V8C21 6.9 20.1 6 19 6H15V5C15 3.34 13.66 2 12 2zM11 6V5C11 4.45 11.45 4 12 4C12.55 4 13 4.45 13 5V6H11zM19 8V20H5V8H19Z"/>
            </svg>
        </a>
        <a th:href="@{/perfil}" class="mb-stat" title="Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
            </svg>
        </a>
        <a th:href="@{/logout}" class="mb-logout" title="Logout">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#FFF8E7" viewBox="0 0 24 24" width="18" height="18">
                <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
            </svg>
        </a>
    </div>
</header>

<div class="carrinho-page">
    <div class="container">
        <h1>AS MINHAS ENCOMENDAS</h1>

        <div th:if="${encomendas.isEmpty()}" class="carrinho-vazio">
            <p>Ainda não tens encomendas.</p>
            <a th:href="@{/cliente}" class="btn-voltar">Ir às Compras</a>
        </div>

        <div class="encomendas-lista" th:if="${!encomendas.isEmpty()}">
            <div class="encomenda-card" th:each="enc : ${encomendas}">
                <div class="encomenda-header">
                    <span class="encomenda-num">#<span th:text="${enc.id}"></span></span>
                    <span class="encomenda-estado"
                          th:text="${enc.estado}"
                          th:classappend="${enc.estado == 'Pendente'} ? ' estado-pendente' :
                                         (${enc.estado == 'Em preparação'} ? ' estado-preparacao' :
                                         (${enc.estado == 'Enviado'} ? ' estado-enviado' : ' estado-entregue'))">
                    </span>
                </div>
                <div class="encomenda-info">
                    <div>Data: <span th:text="${#temporals.format(enc.dataCompra, 'dd/MM/yyyy HH:mm')}"></span></div>
                    <div>Pagamento: <span th:text="${enc.tipoPagamento}"></span></div>
                    <div style="grid-column: 1 / -1;">Morada: <span th:text="${enc.morada}"></span></div>
                </div>
                <div class="encomenda-itens">
                    <div class="encomenda-item" th:each="item : ${enc.itens}">
                        <span th:text="${item.nomeVeiculo} + ' x' + ${item.quantidade}"></span>
                        <span>€<span th:text="${#numbers.formatDecimal(item.precoUnitario * item.quantidade, 1, 2)}"></span></span>
                    </div>
                </div>
                <div class="encomenda-total">
                    <span>Total</span>
                    <span>€<span th:text="${#numbers.formatDecimal(enc.totalPago, 1, 2)}"></span></span>
                </div>
                <div style="margin-top: 1rem;">
                    <a th:href="@{/cliente/carrinho/fatura/{id}/pdf(id=${enc.id})}" class="btn-pdf-small">📄 Descarregar PDF</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
