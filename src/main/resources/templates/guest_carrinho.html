<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho – AutoUBI</title>
    <link rel="stylesheet" th:href="@{/css/carrinho.css}" />
</head>
<body>

<header class="mb-header">
    <div class="mb-container">
        <div class="mb-logo">
            <a th:href="@{/cliente}">AutoUBI</a>
        </div>
        <nav class="mb-nav"></nav>
        <a th:href="@{/guest/carrinho}" class="mb-stat" title="Carrinho" style="background: rgba(212,162,89,0.15);">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#D4A259" viewBox="0 0 24 24" width="18" height="18">
                <path d="M12 2C10.34 2 9 3.34 9 5V6H5C3.9 6 3 6.9 3 8V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V8C21 6.9 20.1 6 19 6H15V5C15 3.34 13.66 2 12 2zM11 6V5C11 4.45 11.45 4 12 4C12.55 4 13 4.45 13 5V6H11zM19 8V20H5V8H19Z"/>
            </svg>
        </a>
        <a th:href="@{/login}" class="mb-stat" title="Iniciar Sessão" style="font-size:0.8rem;color:#FFF8E7;text-decoration:none;padding:4px 8px">Entrar</a>
        <a th:href="@{/register(from='guest')}" class="mb-logout" title="Registar" style="font-size:0.8rem;color:#FFF8E7;text-decoration:none;padding:4px 8px">Registar</a>
    </div>
</header>

<div class="carrinho-page">
    <div class="container">
        <h1>MEU CARRINHO</h1>

        <div class="alert" style="background:rgba(212,162,89,0.15);border:1px solid rgba(212,162,89,0.4);color:#D4A259;padding:0.9rem 1.2rem;border-radius:8px;margin-bottom:1.2rem;">
            <strong>Está a navegar como visitante.</strong>
            Crie uma conta para finalizar a sua compra — os seus artigos serão preservados.
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}"></span>
        </div>

        <div th:if="${#lists.isEmpty(guestItems)}" class="carrinho-vazio">
            <p>O seu carrinho está vazio.</p>
            <a th:href="@{/cliente}" class="btn-voltar">Continuar a Comprar</a>
        </div>

        <div th:if="${!#lists.isEmpty(guestItems)}">
            <div class="carrinho-items">
                <div class="carrinho-item" th:each="item : ${guestItems}">
                    <div class="item-imagem">
                        <img th:src="@{'/' + ${item.veiculo.imagem}}" th:alt="${item.veiculo.nome}"
                             onerror="this.src='/images/placeholder.jpg';" />
                    </div>
                    <div class="item-info">
                        <h3 th:text="${item.veiculo.nome}"></h3>
                        <p class="item-preco">€<span th:text="${#numbers.formatDecimal(item.veiculo.preco, 1, 2)}"></span></p>
                        <p class="item-quantidade">Quantidade: <span th:text="${item.quantidade}"></span></p>
                        <p class="item-subtotal">Subtotal: €<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span></p>
                    </div>
                    <div class="item-acoes">
                        <form th:action="@{/guest/carrinho/remover/{id}(id=${item.veiculo.id})}" method="post">
                            <button type="submit" class="btn-remover">Remover</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="carrinho-total">
                <h2>Total: €<span th:text="${#numbers.formatDecimal(totalCarrinho, 1, 2)}"></span></h2>
                <div class="carrinho-acoes">
                    <a th:href="@{/cliente}" class="btn-continuar">Continuar a Comprar</a>
                    <a th:href="@{/register(from='guest')}" class="btn-finalizar" style="text-decoration:none;display:inline-block;text-align:center;">
                        Criar conta para finalizar
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
